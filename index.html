<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>소화 카페 매니저 (모바일)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app-container">
        <!-- 헤더 영역 -->
        <header class="app-header">
            <h1 id="page-title">오늘의 현황</h1>
            <div id="current-time">00:00</div>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main id="main-view" class="content-scroll"></main>

        <!-- 하단 네비게이션 바 -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-page="dashboard" onclick="setPage('dashboard')">
                <span class="icon">📊</span>
                <span class="label">현황</span>
            </div>
            <div class="nav-item" data-page="checklist" onclick="setPage('checklist')">
                <span class="icon">✅</span>
                <span class="label">체크</span>
            </div>
            <div class="nav-item" data-page="order" onclick="setPage('order')">
                <span class="icon">📦</span>
                <span class="label">발주</span>
            </div>
            <div class="nav-item" data-page="recipes" onclick="setPage('recipes')">
                <span class="icon">📖</span>
                <span class="label">레시피</span>
            </div>
            <div class="nav-item" data-page="editor" onclick="setPage('editor')">
                <span class="icon">⚙️</span>
                <span class="label">관리</span>
            </div>
        </nav>
    </div>

    <!-- 모달(팝업) -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-box">
            <h3 id="modal-title">알림</h3>
            <div id="modal-content">내용</div>
            <button class="btn-close" onclick="closeModal()">닫기</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
